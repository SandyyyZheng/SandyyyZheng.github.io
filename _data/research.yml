- id: mist
  name: MIST
  area: LLM Safety · Jailbreak Attack
  venue: arXiv 2025 (Under Review)
  authorship: First author
  title: "MIST: Jailbreaking Black-box Large Language Models via Iterative Semantic Tuning"
  tldr: "Iterative, meaning-preserving prompt refinement exposes safety vulnerabilities in black-box LLMs without access to their internals."
  image: "/images/research/mist.png"
  image_alt: "Overview of MIST's iterative semantic tuning method for evaluating black-box LLM safety."
  links:
    - label: Paper
      url: https://arxiv.org/abs/2506.16792
    - label: Code
      url: https://github.com/SandyyyZheng/MIST

